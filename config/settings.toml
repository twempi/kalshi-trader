# kalshi-trader configuration (non-secret). Secrets go in .env, never here.
# Any value can be overridden from the environment, e.g. KT_RISK__MAX_OPEN_POSITIONS=3.
# PAPER TRADING ONLY: this application has no code path that submits real orders.

log_level = "INFO"
db_path = "data/kalshi_trader.db"
log_dir = "data/logs"

[kalshi]
environment = "prod"            # market data from production; "demo" for the sandbox
max_requests_per_second = 8.0   # client-side cap; each HTTP 429 halves it, then it recovers
burst = 10
max_retries = 5
use_websocket = true            # only used when API credentials are configured

[discovery]
series_tickers = [
  "KXATPMATCH", "KXWTAMATCH", "KXATPCHALLENGERMATCH",
  "KXWTACHALLENGERMATCH", "KXITFMATCH", "KXITFWMATCH",
]
refresh_interval_s = 60
lookahead_hours = 6
lookback_hours = 18

[market_data]
rest_poll_interval_s = 3.0      # REST order-book polling when the WebSocket is unavailable
recorded_depth_levels = 5
snapshot_heartbeat_s = 60
snapshot_min_interval_s = 1.0   # 2026-11-13: every WebSocket book change was a row (~340/s, ~12 GB/day, disk 95% full); now at most 1/s per market, latest state kept
snapshot_retention_days = 14   # 2026-11-13: delete recorded books older than 14 days so the database stops growing (disk 95% full); trades, evidence and score snapshots are kept
status_refresh_interval_s = 30

[tennis]
provider = "kalshi_live_data"   # free Kalshi Live Data API; "none" disables scores
poll_interval_s = 5.0
snapshot_heartbeat_s = 120

[model]
serve_mean_sd = 0.03                  # sd of the match's average serve-point win prob
strength_diff_sd_with_price = 0.025   # sd of the players' serve-prob difference, price-anchored
strength_diff_sd_no_price = 0.06      # ... when no pre-match price is known
prior_draws = 4000                    # sampling-importance-resampling draws
use_pre_match_price_prior = true
retirement_hazard_per_game = 0.0003
uncertainty_samples = 200
credible_quantile = 0.10
latency_points = 1                    # assume the score feed may be 1 point behind the market

[model.serve_win_prior]
ATP = 0.640
WTA = 0.560
ATP_CHALLENGER = 0.620
WTA_CHALLENGER = 0.555
ITF_MEN = 0.600
ITF_WOMEN = 0.545

[strategies]
evaluation_interval_s = 1.0
# Every strategy that is not "off" also trades its own standalone SHADOW ledger, so all
# strategies are compared on identical observations with identical risk rules.
shadow_ledgers = true
entry_cooldown_s = 30.0

# mode: "off" (not loaded) | "observe" (evaluated + shadow ledger, never main capital)
#       | "paper" (eligible for the main paper account via the central allocator).
# Nothing can place a real order in any mode.

[strategies.tennis_model]        # A/C: statistical mispricing with the tennis Markov model
mode = "paper"
stages = ["early", "mid", "late"]   # "prematch" is always reported unsupported (no independent prior)
tours = []                           # empty = all; e.g. ["ATP", "WTA"]
min_price = 0.20                    # below 20¢ the model overrates underdogs and fees+spread exceed ~10% of the price
max_price = 0.95
min_edge = 0.03                     # $/contract after fees, at the final fill, conservative probability
max_spread = 0.04
limit_slippage = 0.02
late_games_from_victory = 3
require_pre_match_prior = true
min_effective_sample_size = 50

[strategies.tennis_model.calibration]   # logit(p) = slope*logit(p_model) + market_weight*logit(mid)
slope = 1.0                         # 1.0 / 0.0 = the raw model. Fit with `research calibrate` or the
market_weight = 0.0                 # dashboard's Research tab; changing these resets the evidence

# Variants: observe-only copies of tennis_model with a few settings changed. Each runs as
# strategy tennis_model_<name> with its own shadow ledger on the same matches, so ideas are
# compared side by side without touching the main account or tennis_model's evidence.
# Promote a winner by copying its settings into [strategies.tennis_model].
[strategies.tennis_model_variants.itf_only]   # all profit so far came from ITF matches
tours = ["ITF_MEN", "ITF_WOMEN"]

[strategies.tennis_model_variants.no_late]    # the model shows no edge late in matches
stages = ["early", "mid"]

[strategies.tennis_model_variants.edge_exit]  # sell once the market pays more than the model's value
exit_edge = 0.03

[strategies.tennis_model_variants.comeback]   # observe-only test; the main strategy's evidence stays intact
entry_pattern = "first_set_comeback"        # back the original favourite after a first-set loss, in set two of Bo3
exit_edge = 0.03                            # reuse edge_exit's existing sale rule to isolate this entry pattern, without guessing a new target

[strategies.tennis_model_variants.itf_women]  # the only tour profitable both before and after the 2026-11-08 review; a subgroup pick, so forward-test it
tours = ["ITF_WOMEN"]

[strategies.tennis_model_variants.gap_cap]    # 2026-11-11: model 20-30c above the ask won no more than the ask implied (-$122); 0.20 comes from that data, so only forward results count
max_model_gap = 0.20

# 2026-11-13 data-collection batch: observe only, to see what sticks. The values are fixed test
# points, not fitted. With this many variants the best one will look good by luck, so any
# winner must repeat on a later, separate window before it is promoted.
# Shrink toward the market: the model overstated its edge on the trades it picked (147 wins
# predicted, 128 realised, ask implied 105). Uses the existing logit blend, model^slope * mid^weight.
[strategies.tennis_model_variants.shrink50]   # halfway between model and mid
calibration = { slope = 0.5, market_weight = 0.5 }

[strategies.tennis_model_variants.shrink75]   # three quarters of the way to the mid
calibration = { slope = 0.25, market_weight = 0.75 }

[strategies.tennis_model_variants.shrink50_exit]  # shrink50 plus edge_exit's sale rule (the best variant so far)
calibration = { slope = 0.5, market_weight = 0.5 }
exit_edge = 0.03

[strategies.tennis_model_variants.edge6]      # double the entry bar: do bigger conservative edges hold up?
min_edge = 0.06

[strategies.tennis_model_variants.tight_spread]   # only tight books (more liquid, likely more efficient prices)
max_spread = 0.02

# Partitions: each splits tennis_model's trades into non-overlapping parts, to see where any edge lives.
[strategies.tennis_model_variants.favourites] # backed side priced 50c or more
min_price = 0.50

[strategies.tennis_model_variants.underdogs]  # backed side priced under 50c (bounds are inclusive and prices whole cents)
max_price = 0.49

[strategies.tennis_model_variants.early_only] # first set
stages = ["early"]

[strategies.tennis_model_variants.mid_only]
stages = ["mid"]

[strategies.tennis_model_variants.late_only]  # a player within 3 games of winning
stages = ["late"]

[strategies.tennis_model_variants.itf_men]    # complements itf_women; ITF men flipped from +$132 to -$125 after 11-08
tours = ["ITF_MEN"]

[strategies.tennis_model_variants.pro_tours]  # everything but ITF (ATP, WTA and their Challengers)
tours = ["ATP", "WTA", "ATP_CHALLENGER", "WTA_CHALLENGER"]

[strategies.cross_market]        # B: baskets with verified settlement relationships
mode = "paper"
min_edge = 0.01                  # $/basket unit after all fees
include_tennis_pairs = true
series_tickers = []              # extra non-tennis series to scan, e.g. ["KXHIGHNY"]
refresh_interval_s = 300
max_legs = 12
max_book_age_s = 5
min_persistence_s = 2
min_persistence_scans = 2
max_units = 50

[strategies.late_match]          # Baseline 2: the original late-match rules, unchanged
mode = "observe"
min_price = 0.80
max_price = 0.97
min_model_prob = 0.90
min_edge = 0.02
max_games_from_victory = 3
require_deciding_set = false
max_spread = 0.04
limit_slippage = 0.01

[strategies.price_threshold]     # Baseline 1: favourites in a price band (no model)
mode = "observe"                 # 2026-11-13: on as the no-model control the tennis variants must beat (was off)
min_price = 0.90
max_price = 0.97
max_spread = 0.03
limit_slippage = 0.00
require_live_match = true

[strategies.market_making]       # D: research simulation only ("off" or "observe")
mode = "observe"
min_spread = 0.04
quote_size = 10
max_inventory = 50
min_price = 0.10
max_price = 0.90
adverse_horizon_s = 60
max_book_age_s = 10

[risk]
max_fraction_per_trade = 0.02   # max loss of one trade, as a share of current equity (grows with the account)
# max_position_cost = 25        # optional fixed dollar ceiling on top; unset = percentage only
# Daily loss and drawdown limits block NEW entries; open positions can still lose their cost.
max_daily_loss = 50             # dollars (UTC day, mark-to-bid)
max_drawdown_fraction = 0.15    # triggers the persistent emergency stop
max_open_positions = 5
max_aggregate_exposure_fraction = 0.30    # total open max loss / equity
max_event_exposure_fraction = 0.03        # per underlying event
max_strategy_exposure_fraction = 0.15
max_correlated_exposure_fraction = 0.08   # per tournament (tennis) / series (other)
min_liquidity_contracts = 10
max_spread = 0.05
max_market_data_age_s = 10
max_score_data_age_s = 30       # includes the score source's cache age
score_source_staleness_s = 10   # assumed CDN cache age when the HTTP Age header is absent
max_score_unchanged_s = 300
max_mid_move_since_score_change = 0.10
max_trades_per_market = 1
max_trades_per_event = 1
kelly_fraction = 0.10               # bet size scales with the conservative edge; back from 0.20 after the 15% drawdown on 2026-11-11 (the model overstated its edge ~4x)
unvalidated_size_multiplier = 0.25   # strategies without validated evidence; 0.25 = cautious (was 1.0); tennis_model is unvalidated again on 2026-11-11 (p = 0.098)
max_consecutive_errors = 5

[evidence]                       # what a strategy must show (forward, out-of-sample) to be "validated"
min_out_of_sample_trades = 50
min_out_of_sample_events = 30
max_calibration_pvalue = 0.05
require_positive_ci = true
max_drawdown_fraction = 0.20

[fees]
taker_rate = 0.07
maker_rate = 0.0175

[paper]
starting_balance = 1000
displayed_liquidity_fraction = 0.5
basket_later_leg_liquidity_fraction = 0.5   # legging stress for multi-leg baskets
enable_exits = false
take_profit_bid = 0.99

[dashboard]
host = "127.0.0.1"   # this machine only; share with other devices via `tailscale serve` (README)
port = 8787
# Who besides this machine may use Pause / Resume / Emergency stop. These are Tailscale's
# address ranges, so devices on your tailnet can use the buttons when the dashboard is shared
# with `tailscale serve`. Set to [] to make the buttons work only on this machine.
control_networks = ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]
